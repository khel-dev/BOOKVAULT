<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookVault - Login</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="container">

    <!-- Logo -->
    <div class="logo-card">
      <div class="logo-content">
        <div class="logo-icon">
          <svg width="120" height="80" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 20 L50 10 L80 20 L80 60 L50 70 L20 60 Z" fill="#00adef" opacity="0.8"/>
            <path d="M30 25 L60 15 L90 25 L90 65 L60 75 L30 65 Z" fill="#2e3192" opacity="0.9"/>
            <path d="M40 30 L70 20 L100 30 L100 70 L70 80 L40 70 Z" fill="#00adef"/>
          </svg>
        </div>
        <h1 class="logo-text">BOOKVAULT</h1>
      </div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="login-header">
        <h2 class="brand-title">
          BookVault
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="#2e3192" stroke-width="2"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="#2e3192" stroke-width="2"/>
            <path d="M8 7h8M8 11h6" stroke="#2e3192" stroke-width="2"/>
          </svg>
        </h2>
        <p class="welcome-text">Welcome to BookVault! Please enter your details to continue</p>
      </div>

      <!-- Login Form -->
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input" required>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="remember" name="remember">
            <span class="checkmark"></span>
            Remember me
          </label>
        </div>

        <button type="submit" class="login-button">Login</button>

        <div class="divider">
          <span class="divider-line"></span>
          <span class="divider-text">or</span>
          <span class="divider-line"></span>
        </div>

        <a href="registration_personal.html" class="create-account-link">Create Account</a>
      </form>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
