<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — BookKeeper</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f1b3d 0%, #1a2a6c 45%, #00adef 100%); padding: 24px; }
    .card { width: 100%; max-width: 420px; background: rgba(255,255,255,.98); border-radius: 20px; padding: 40px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,.25); }
    h1 { font-size: 22px; color: #1a1a2e; text-align: center; margin-bottom: 8px; }
    p.sub { color: #6b7280; font-size: 14px; text-align: center; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
    input[type=email] { width: 100%; padding: 14px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 14px; }
    input:focus { outline: none; border-color: #2e3192; box-shadow: 0 0 0 3px rgba(46,49,146,.12); }
    .btn { width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 12px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, #2e3192, #00adef); cursor: pointer; font-size: 15px; }
    .btn:disabled { opacity: .65; cursor: not-allowed; }
    .err { display: none; background: #fff0f0; color: #b91c1c; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
    .err.show { display: block; }
    .back { display: block; text-align: center; margin-top: 20px; color: #6b7280; font-size: 14px; text-decoration: none; }
    .back:hover { color: #2e3192; }
    .ok { display: none; text-align: center; }
    .ok.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div id="formPanel">
      <h1><i class="fas fa-lock" style="color:#2e3192;"></i> Reset password</h1>
      <p class="sub">Enter your account email. We’ll send a reset link (check spam too).</p>
      <div class="err" id="errBox" role="alert"></div>
      <form id="f" onsubmit="sendReset(event)">
        <label for="em">Email</label>
        <input type="email" id="em" required autocomplete="email" placeholder="you@company.com">
        <button class="btn" type="submit" id="btn"><i class="fas fa-paper-plane"></i> Send link</button>
      </form>
      <a class="back" href="login.html"><i class="fas fa-arrow-left"></i> Back to login</a>
    </div>
    <div class="ok" id="okPanel">
      <h1>Check your email</h1>
      <p class="sub">If an account exists for <strong id="sentTo"></strong>, a reset link was sent.</p>
      <a class="back" href="login.html" style="display:inline-block;margin-top:8px;">Return to login</a>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="../assets/js/firebase/firebaseConfig.js"></script>
  <script src="../assets/js/firebase/firebaseInit.js"></script>
  <script src="../assets/js/firebase/authService.js"></script>
  <script>
    async function sendReset(e) {
      e.preventDefault();
      const email = document.getElementById("em").value.trim();
      const btn = document.getElementById("btn");
      const err = document.getElementById("errBox");
      err.classList.remove("show");
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        let w = 0;
        while (!window.authService && !window.firebaseAuth && w++ < 40) await new Promise(r => setTimeout(r, 100));
        if (window.authService?.resetPassword) await window.authService.resetPassword(email);
        else if (window.firebaseAuth) await window.firebaseAuth.sendPasswordResetEmail(email);
        else throw new Error("Auth not ready");
        document.getElementById("formPanel").style.display = "none";
        document.getElementById("sentTo").textContent = email;
        document.getElementById("okPanel").classList.add("show");
      } catch (x) {
        const map = { "auth/user-not-found": "No account for this email.", "auth/invalid-email": "Invalid email.", "auth/too-many-requests": "Too many attempts. Try later." };
        err.textContent = map[x.code] || x.message || "Could not send email.";
        err.classList.add("show");
        btn.disabled = false;
        btn.innerHTML = "<i class=\"fas fa-paper-plane\"></i> Send link";
      }
    }
  </script>
</body>
</html>
