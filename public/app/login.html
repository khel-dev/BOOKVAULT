<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookVault - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
  <div class="container">

    <!-- Logo -->
<div class="logo-card">
  <div class="logo-content">
    <div class="logo-icon">
      <img src="../assets/img/BookVault Logo.png" alt="BookVault Logo" width="120" height="80" style="object-fit: contain;"/>
    </div>
    <h1 class="logo-text">BOOKVAULT</h1>
  </div>
</div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="login-header">
        <h2 class="brand-title">
          BookVault
          <img src="../assets/img/BookVault Logo.png" alt="BookVault Logo" width="60" height="50" style="object-fit: contain;"/>
        </h2>
        <p class="welcome-text">Welcome to BookVault! Please enter your details to continue</p>
      </div>

      <!-- Login Form -->
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="username" class="form-label">Email</label>
          <input type="email" id="username" name="username" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input" required>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="remember" name="remember">
            <span class="checkmark"></span>
            Remember me
          </label>
        </div>

        <button type="submit" class="login-button">Login</button>

        <div class="divider">
          <span class="divider-line"></span>
          <span class="divider-text">or</span>
          <span class="divider-line"></span>
        </div>

        <a href="registration_personal.html" class="create-account-link">Create Account</a>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase/firebaseConfig.js"></script>
  <script src="../assets/js/firebase/firebaseInit.js"></script>
  <script src="../assets/js/firebase/authService.js"></script>
  <script src="../assets/js/firebase/userDataService.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
